<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <link rel="manifest" href="manifest.json" />
        <link rel="apple-touch-icon" href="icon-192.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Sổ chủ nhiệm" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#e3f5ee" />
        <title>Sổ chủ nhiệm THCS-THPT Phan Châu Trinh</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap"
        />
        <style>
            /* ============ Glassmorphism · Mint ============ */
            :root {
                --bg: #e3f5ee;
                --card: rgba(255, 255, 255, 0.58);
                --card-solid: #f2fbf7;
                --ink: #0e2a23;
                --mut: #47675d;
                --line: rgba(14, 100, 78, 0.16);
                --pri: #0a7a5e;
                --pri-2: #12a37e;
                --red: #c0392f;
                --ok: #1f7f46;
                --warn: #a86a0b;
                --soft: rgba(18, 163, 126, 0.1);
                --field: rgba(255, 255, 255, 0.64);
                --on-pri: #fff;
                --btn-a: #10a07a;
                --btn-b: #087559;
                --glass-edge: rgba(255, 255, 255, 0.78);
                --glass-shadow:
                    0 10px 34px rgba(16, 112, 86, 0.14),
                    inset 0 1px 0 rgba(255, 255, 255, 0.85);
                --scrim: rgba(227, 245, 238, 0.74);
                --toast-bg: rgba(14, 42, 35, 0.88);
                --toast-tx: #e9fbf4;
                --o1: rgba(52, 211, 168, 0.55);
                --o2: rgba(120, 224, 214, 0.5);
                --o3: rgba(196, 244, 198, 0.65);
                --ok-bg: #d6f4e4;
                --warn-bg: #fbeccb;
                --red-bg: #fbe0dd;
                --pink: #b83280;
                --pink-bg: #fbe3f0;
                --info: #1c5aa6;
                --info-bg: #dcebfb;
                --warn-tx: #7e4f08;
                color-scheme: light;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #06130f;
                    --card: rgba(20, 42, 35, 0.56);
                    --card-solid: #11261f;
                    --ink: #e2f6ee;
                    --mut: #8fb5a7;
                    --line: rgba(160, 255, 225, 0.14);
                    --pri: #5eebc0;
                    --pri-2: #34d6a4;
                    --red: #ff8a83;
                    --ok: #72de9d;
                    --warn: #eab75a;
                    --soft: rgba(94, 235, 192, 0.1);
                    --field: rgba(4, 18, 14, 0.55);
                    --on-pri: #03241a;
                    --btn-a: #6ff0c9;
                    --btn-b: #2fc79e;
                    --glass-edge: rgba(190, 255, 232, 0.14);
                    --glass-shadow:
                        0 12px 40px rgba(0, 0, 0, 0.45),
                        inset 0 1px 0 rgba(200, 255, 236, 0.08);
                    --scrim: rgba(5, 17, 13, 0.78);
                    --toast-bg: rgba(226, 246, 238, 0.92);
                    --toast-tx: #08231b;
                    --o1: rgba(30, 190, 145, 0.32);
                    --o2: rgba(40, 150, 170, 0.28);
                    --o3: rgba(60, 200, 130, 0.2);
                    --ok-bg: #123a2a;
                    --warn-bg: #3a3015;
                    --red-bg: #3e2022;
                    --pink: #f59ac7;
                    --pink-bg: #3a2233;
                    --info: #92bff5;
                    --info-bg: #1b3450;
                    --warn-tx: #eab75a;
                    color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --bg: #06130f;
                --card: rgba(20, 42, 35, 0.56);
                --card-solid: #11261f;
                --ink: #e2f6ee;
                --mut: #8fb5a7;
                --line: rgba(160, 255, 225, 0.14);
                --pri: #5eebc0;
                --pri-2: #34d6a4;
                --red: #ff8a83;
                --ok: #72de9d;
                --warn: #eab75a;
                --soft: rgba(94, 235, 192, 0.1);
                --field: rgba(4, 18, 14, 0.55);
                --on-pri: #03241a;
                --btn-a: #6ff0c9;
                --btn-b: #2fc79e;
                --glass-edge: rgba(190, 255, 232, 0.14);
                --glass-shadow:
                    0 12px 40px rgba(0, 0, 0, 0.45),
                    inset 0 1px 0 rgba(200, 255, 236, 0.08);
                --scrim: rgba(5, 17, 13, 0.78);
                --toast-bg: rgba(226, 246, 238, 0.92);
                --toast-tx: #08231b;
                --o1: rgba(30, 190, 145, 0.32);
                --o2: rgba(40, 150, 170, 0.28);
                --o3: rgba(60, 200, 130, 0.2);
                --ok-bg: #123a2a;
                --warn-bg: #3a3015;
                --red-bg: #3e2022;
                --pink: #f59ac7;
                --pink-bg: #3a2233;
                --info: #92bff5;
                --info-bg: #1b3450;
                --warn-tx: #eab75a;
                color-scheme: dark;
            }
            :root {
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
                --hh: 150px;
            }
            html {
                scroll-padding-top: calc(var(--hh) + 24px);
            }
            *,
            *:before,
            *:after {
                box-sizing: inherit;
            }
            body {
                margin: 0;
                min-height: 100vh;
                background: var(--bg);
                color: var(--ink);
                font:
                    15px/1.5 "Be Vietnam Pro",
                    system-ui,
                    "Segoe UI",
                    sans-serif;
            }
            /* nền aurora mint phía sau lớp kính */
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;
                background:
                    radial-gradient(
                        46vmax 46vmax at 8% 6%,
                        var(--o1),
                        transparent 62%
                    ),
                    radial-gradient(
                        42vmax 42vmax at 96% 18%,
                        var(--o2),
                        transparent 60%
                    ),
                    radial-gradient(
                        50vmax 50vmax at 60% 104%,
                        var(--o3),
                        transparent 62%
                    );
            }
            ::selection {
                background: var(--pri-2);
                color: var(--on-pri);
            }
            * {
                scrollbar-width: thin;
                scrollbar-color: var(--pri-2) transparent;
            }

            /* ---- lớp kính dùng chung ---- */
            header,
            .card {
                background: var(--card);
                -webkit-backdrop-filter: blur(18px) saturate(165%);
                backdrop-filter: blur(18px) saturate(165%);
                border: 1px solid var(--glass-edge);
                box-shadow: var(--glass-shadow);
            }
            @supports not (
                (backdrop-filter: blur(1px)) or
                    (-webkit-backdrop-filter: blur(1px))
            ) {
                header,
                .card {
                    background: var(--card-solid);
                }
            }

            header {
                position: fixed;
                z-index: 5;
                top: calc(env(safe-area-inset-top, 0px) + 0px);
                left: 12px;
                right: 12px;
                border-radius: 20px;
                padding: 14px 20px 10px;
            }
            h1 {
                margin: 0 0 8px;
                font-size: 20px;
                font-weight: 700;
                letter-spacing: -0.01em;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            h1::before {
                content: "";
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: linear-gradient(135deg, var(--btn-a), var(--btn-b));
                box-shadow: 0 0 0 4px var(--soft);
            }
            .meta {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 10px;
            }
            .meta input {
                width: auto;
                min-width: 120px;
            }
            nav {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                padding-bottom: 2px;
            }
            nav button {
                border: 1px solid transparent;
                background: none;
                padding: 7px 16px;
                font: inherit;
                color: var(--mut);
                cursor: pointer;
                border-radius: 999px;
                white-space: nowrap;
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            nav button:hover {
                background: var(--soft);
                color: var(--ink);
            }
            nav button.on {
                color: var(--pri);
                background: var(--soft);
                border-color: var(--line);
                font-weight: 700;
            }
            main {
                max-width: 1300px;
                margin: calc(var(--hh) + 20px) auto 0 auto;
                padding: 18px 16px 40px;
            }
            .card {
                border-radius: 18px;
                padding: 16px;
                margin-bottom: 16px;
            }
            h2 {
                font-size: 17px;
                margin: 0 0 10px;
            }
            h3 {
                font-size: 15px;
                margin: 14px 0 8px;
            }
            summary {
                cursor: pointer;
            }
            .bar {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin-bottom: 12px;
            }
            .sp {
                flex: 1;
            }

            /* ---- form ---- */
            input,
            select {
                font: inherit;
                color: var(--ink);
                background: var(--field);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 6px 10px;
                width: 100%;
                transition:
                    border-color 0.15s,
                    box-shadow 0.15s;
            }
            input::placeholder {
                color: var(--mut);
                opacity: 0.8;
            }
            td input,
            td select {
                padding: 1px 8px;
                border-radius: 8px;
            }
            input[type="checkbox"] {
                accent-color: var(--pri-2);
            }
            input[type="file"]::file-selector-button {
                font: inherit;
                margin-right: 10px;
                border: 1px solid var(--pri);
                background: var(--soft);
                color: var(--pri);
                border-radius: 8px;
                padding: 3px 12px;
                cursor: pointer;
            }
            select {
                cursor: pointer;
            }
            button.b {
                font: inherit;
                border: 1px solid transparent;
                background: linear-gradient(135deg, var(--btn-a), var(--btn-b));
                color: var(--on-pri);
                font-weight: 500;
                border-radius: 10px;
                padding: 6px 14px;
                cursor: pointer;
                box-shadow: 0 4px 14px rgba(16, 160, 122, 0.28);
                transition:
                    filter 0.15s,
                    background 0.15s,
                    box-shadow 0.15s;
            }
            button.b:hover {
                filter: brightness(1.07);
            }
            button.b:active {
                transform: translateY(1px);
            }
            button.b.g {
                background: var(--field);
                color: var(--pri);
                border-color: var(--line);
                box-shadow: none;
            }
            button.b.g:hover {
                background: var(--soft);
                border-color: var(--pri);
                filter: none;
            }
            button.b.d {
                background: var(--red-bg);
                color: var(--red);
                border-color: var(--red);
                box-shadow: none;
            }
            button:focus-visible,
            input:focus-visible,
            select:focus-visible {
                outline: 2px solid var(--pri-2);
                outline-offset: 1px;
            }
            input:focus,
            select:focus {
                border-color: var(--pri-2);
                box-shadow: 0 0 0 3px var(--soft);
            }

            /* ---- bảng ---- */
            .tw {
                overflow-x: auto;
                border-radius: 12px;
            }
            table {
                border-collapse: separate;
                border-spacing: 0;
                width: 100%;
                font-size: 14px;
                border: 1px solid var(--line);
                border-radius: 12px;
            }
            th,
            td {
                border-right: 1px solid var(--line);
                border-bottom: 1px solid var(--line);
                padding: 6px 10px;
                text-align: left;
                vertical-align: middle;
                text-transform: capitalize;
            }
            td.email {
                text-transform: none;
            }
            th:last-child,
            td:last-child {
                border-right: 0;
            }
            tr:last-child > td {
                border-bottom: 0;
            }
            th {
                background: var(--soft);
                font-weight: 500;
                white-space: nowrap;
            }
            tr:hover > td {
                background: var(--soft);
            }
            td.n,
            th.n {
                text-align: center;
            }
            .form {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 8px;
                margin-bottom: 10px;
            }
            label span {
                display: block;
                font-size: 12px;
                margin: 5px 0;
                color: var(--mut);
            }
            .tag {
                display: inline-block;
                padding: 1px 10px;
                border-radius: 999px;
                font-size: 12px;
                background: var(--soft);
                border: 1px solid transparent;
                font-weight: 600;
            }
            .t-Tốt {
                color: var(--ok);
            }
            .t-Khá {
                color: var(--pri);
            }
            .t-Đạt {
                color: var(--warn);
            }
            .t-Chưa {
                color: var(--red);
            }
            .hb {
                display: grid;
                grid-template-columns: 110px 1fr 70px;
                gap: 8px;
                align-items: center;
                margin: 5px 0;
                font-size: 14px;
            }
            .hb i {
                display: block;
                height: 16px;
                border-radius: 999px;
                background: linear-gradient(90deg, var(--pri-2), var(--btn-a));
            }
            .hb div {
                background: var(--soft);
                border-radius: 999px;
                overflow: hidden;
            }
            .grid2 {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 16px;
            }
            .sum {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                font-weight: 500;
            }
            .pos {
                color: var(--ok);
            }
            .neg {
                color: var(--red);
            }
            .user-chip {
                display: none;
                align-items: center;
                gap: 8px;
                padding: 3px 12px 3px 3px;
                border: 1px solid var(--line);
                border-radius: 999px;
                background: var(--field);
                max-width: 260px;
            }
            .user-chip.on {
                display: inline-flex;
            }
            .user-chip .av {
                width: 28px;
                height: 28px;
                flex: none;
                border-radius: 50%;
                background: linear-gradient(135deg, var(--btn-a), var(--btn-b));
                color: var(--on-pri);
                display: grid;
                place-items: center;
                font-size: 13px;
                font-weight: 700;
                text-transform: uppercase;
            }
            .user-chip .em {
                font-size: 13px;
                color: var(--ink);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .mut {
                color: var(--mut);
                font-size: 13px;
            }
            .ph {
                display: none;
            }

            /* màn đăng nhập + thông báo */
            #auth {
                position: fixed;
                inset: 0;
                z-index: 9;
                overflow: auto;
                display: none;
                padding: 16px;
                background: var(--scrim);
                -webkit-backdrop-filter: blur(26px) saturate(150%);
                backdrop-filter: blur(26px) saturate(150%);
            }
            #msg {
                display: none;
                position: fixed;
                left: 50%;
                bottom: calc(20px + env(safe-area-inset-bottom, 0px));
                transform: translateX(-50%);
                background: var(--toast-bg);
                color: var(--toast-tx);
                -webkit-backdrop-filter: blur(12px);
                backdrop-filter: blur(12px);
                padding: 8px 18px;
                border-radius: 999px;
                z-index: 20;
                max-width: 90%;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
            }

            /* màu điểm / trạng thái */
            .sg {
                display: inline-block;
                min-width: 50px;
                padding: 5px 6px;
                border-radius: 8px;
                text-align: center;
                font-weight: 700;
            }
            .sc-g {
                background: var(--ok-bg);
                color: var(--ok);
                text-align: center;
            }
            .sc-y {
                background: var(--warn-bg);
                color: var(--warn-tx);
                text-align: center;
            }
            .sc-r {
                background: var(--red-bg);
                color: var(--red);
                text-align: center;
            }
            input.sc-g,
            input.sc-y,
            input.sc-r {
                font-weight: 600;
            }
            select.opt {
                font-weight: 400;
            }
            /* cột Rèn luyện: đủ rộng để hiện "Chưa đạt" */
            select.opt[onchange^="setHK"] {
                min-width: 118px;
            }
            .o-ok {
                background: var(--ok-bg);
                color: var(--ok);
                border-color: var(--ok);
            }
            .o-warn {
                background: var(--warn-bg);
                color: var(--warn-tx);
                border-color: var(--warn);
            }
            .o-bad {
                background: var(--red-bg);
                color: var(--red);
                border-color: var(--red);
            }
            .o-info {
                background: var(--info-bg);
                color: var(--info);
                border-color: var(--info);
            }
            .o-pink {
                background: var(--pink-bg);
                color: var(--pink);
                border-color: var(--pink);
            }
            .pr {
                display: none;
            }

            /* điện thoại: header cuộn theo trang để không chiếm màn hình */
            @media (max-width: 640px) {
                header {
                    position: absolute;
                    left: 8px;
                    right: 8px;
                    padding: 12px 14px 8px;
                }
                main {
                    padding-left: 8px;
                    padding-right: 8px;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                }
            }

            /* ---- in ấn: giữ nền trắng, bỏ hiệu ứng kính ---- */
            @media print {
                :root,
                :root[data-theme="dark"],
                :root:not([data-theme="light"]) {
                    --bg: #fff;
                    --card: #fff;
                    --ink: #000;
                    --mut: #333;
                    --line: #999;
                    --soft: #eee;
                    --pri: #0a7a5e;
                    --red: #c0392f;
                    --ok: #1f7f46;
                    --warn: #a86a0b;
                    --ok-bg: #d6f4e4;
                    --warn-bg: #fbeccb;
                    --red-bg: #fbe0dd;
                    --pink: #b83280;
                    --pink-bg: #fbe3f0;
                    --info: #1c5aa6;
                    --info-bg: #dcebfb;
                    --warn-tx: #7e4f08;
                }
                body {
                    background: #fff;
                    color: #000;
                }
                body::before {
                    display: none;
                }
                header,
                nav,
                .noprint {
                    display: none !important;
                }
                .ph {
                    display: block;
                    text-align: center;
                    margin-bottom: 12px;
                }
                main {
                    margin-top: 0;
                }
                .card {
                    border: 0;
                    padding: 0;
                    background: none;
                    box-shadow: none;
                    -webkit-backdrop-filter: none;
                    backdrop-filter: none;
                }
                input,
                select {
                    border: 0;
                    background: none;
                    padding: 0;
                    appearance: none;
                    box-shadow: none;
                }
                table {
                    border-collapse: collapse;
                    border: 0;
                    border-radius: 0;
                }
                th,
                td {
                    border: 1px solid #999;
                }
                tr:hover > td {
                    background: none;
                }
                th {
                    background: #eee !important;
                    color: #000;
                }
                .scp {
                    overflow: visible !important;
                }
                .scp table {
                    font-size: 11px;
                    width: 100%;
                    max-width: 100%;
                }
                .scp th,
                .scp td {
                    white-space: normal;
                    padding: 3px 4px;
                    overflow-wrap: anywhere;
                }
                .scp .sg {
                    min-width: 0;
                    padding: 1px 4px;
                    border-radius: 5px;
                }
                .scp .tag {
                    padding: 0 6px;
                }
                .scp select {
                    width: auto;
                    max-width: 100%;
                }
                .scp tr {
                    page-break-inside: avoid;
                }
                .scp tr {
                    break-inside: avoid;
                }
                .scp input {
                    display: none !important;
                }
                .scp .pr {
                    display: inline;
                }
                th {
                    -webkit-print-color-adjust: exact;
                    print-color-adjust: exact;
                }
                /* khi in: chỉ hiện chữ, bỏ nền màu của điểm, học tập, rèn luyện */
                .sg,
                .tag,
                .pr,
                .sc-g,
                .sc-y,
                .sc-r,
                select.opt,
                .o-ok,
                .o-warn,
                .o-bad,
                .o-info,
                .o-pink {
                    background: none !important;
                    border: 0 !important;
                    border-radius: 0 !important;
                    box-shadow: none !important;
                    color: #000 !important;
                    padding: 0 !important;
                    min-width: 0 !important;
                    font-weight: 400 !important;
                }
            }
        </style>
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("scn-theme");
                    if (t === "light" || t === "dark")
                        document.documentElement.dataset.theme = t;
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <header class="noprint">
            <h1>Sổ chủ nhiệm</h1>
            <div class="meta">
                <input
                    id="cn"
                    placeholder="Lớp (vd: 8A2)"
                    aria-label="Lớp"
                /><input
                    id="cy"
                    placeholder="Năm học"
                    aria-label="Năm học"
                /><input
                    id="cg"
                    placeholder="Giáo viên chủ nhiệm"
                    aria-label="GVCN"
                /><select
                    id="cs"
                    aria-label="Chọn lớp"
                    style="width: auto"
                ></select
                ><button class="b g" id="ac">Thêm lớp</button
                ><button class="b d" id="dc">Xóa lớp</button
                ><button class="b g" id="rf">Làm mới</button
                ><button
                    class="b g"
                    id="th"
                    onclick="thm()"
                    title="Đổi giao diện sáng / tối"
                ></button
                ><span id="uc" class="user-chip"
                    ><span class="av" id="av"></span
                    ><span class="em" id="who"></span></span
                ><button class="b g" id="lo">Đăng xuất</button>
            </div>
            <nav id="nav"></nav>
        </header>
        <div id="auth" class="noprint">
            <div
                class="card"
                style="max-width: 420px; margin: 6vh auto"
                id="ab"
            ></div>
        </div>
        <div id="msg" role="status"></div>
        <main id="app"></main>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="config.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <script>
            const $ = (s) => document.querySelector(s),
                r1 = (x) => Math.round(x * 10) / 10,
                U = () =>
                    crypto.randomUUID
                        ? crypto.randomUUID()
                        : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
                              /[xy]/g,
                              (c) => {
                                  const r = (Math.random() * 16) | 0;
                                  return (c == "x" ? r : (r & 3) | 8).toString(
                                      16,
                                  );
                              },
                          );
            const esc = (s) =>
                String(s ?? "").replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            const TABS = [
                ["hs", "Học sinh"],
                ["diem", "Điểm số"],
                ["dd", "Điểm danh"],
                ["quy", "Quỹ lớp"],
                ["bc", "Báo cáo"],
                ["gv", "Giáo viên"],
            ];
            const ATT = {
                C: "Có mặt",
                P: "Nghỉ có phép",
                K: "Nghỉ không phép",
                T: "Đi trễ",
            };
            const LATE_W = 0.75; // đi trễ chỉ tính 75% một buổi có mặt
            const LV = ["Tốt", "Khá", "Đạt", "Chưa đạt"];
            const today = () => new Date().toISOString().slice(0, 10);
            let S,
                V = {
                    tab: "hs",
                    hk: "HK1",
                    mode: "nhap",
                    mon: 0,
                    date: today(),
                    edit: null,
                    del: null,
                    rhk: "HK1",
                };

            let ROOT;
            const SUBJ = [
                "Toán",
                "Ngữ văn",
                "Ngoại ngữ",
                "KHTN",
                "Lịch sử & Địa lí",
                "GDCD",
                "Tin học",
                "Công nghệ",
                "Giáo dục thể chất",
            ];
            const DFM = "(TX + 2*GK + 3*CK) / (N + 5)",
                DFN = "(HK1 + 2*HK2) / 3";
            function blank() {
                return {
                    id: U(),
                    cls: { n: "", y: "", g: "" },
                    subj: [...SUBJ],
                    st: [],
                    sc: { HK1: {}, HK2: {} },
                    hk: { HK1: {}, HK2: {}, CN: {} },
                    att: {},
                    fund: [],
                    f: { mon: DFM, nam: DFN },
                };
            }
            function pick(id) {
                S = ROOT.list.find((c) => c.id == id) || ROOT.list[0];
                ROOT.cur = S.id;
                S.f ??= { mon: DFM, nam: DFN };
                S.cls ??= { n: "", y: "", g: "" };
                S.sc ??= {};
                S.hk ??= {};
                S.hk.HK1 ??= {};
                S.hk.HK2 ??= {};
                S.hk.CN ??= {};
            }
            let sb, USER, MT, T1;
            const isCN = () => S && S.role == "gvcn";
            const ENV = () =>
                !!(window.SCN_CONFIG && SCN_CONFIG.url && SCN_CONFIG.key);
            let REC = /type=recovery/.test(location.hash);
            function setUser(u) {
                const e = (u && u.email) || "";
                $("#who").textContent = e;
                $("#av").textContent = e[0] || "?";
                $("#uc").title = e;
                $("#uc").classList.toggle("on", !!e);
            }
            const CFG = () => {
                if (ENV()) return SCN_CONFIG;
                try {
                    return JSON.parse(localStorage.getItem("scn_cfg"));
                } catch (e) {
                    return null;
                }
            };
            function save() {}
            function msg(t) {
                const m = $("#msg");
                m.textContent = t;
                m.style.display = t ? "block" : "none";
            }
            async function db(p) {
                const r = await p;
                if (r.error) {
                    msg("Lỗi lưu: " + r.error.message);
                } else {
                    msg("Đã lưu ✓");
                    clearTimeout(MT);
                    MT = setTimeout(() => msg(""), 1200);
                }
                return r;
            }
            const toRow = (x) => ({
                id: x.id,
                class_id: S.id,
                code: x.ma,
                full_name: x.ten,
                dob: x.ns || null,
                gender: x.gt,
                guardian: x.ph,
                phone: x.sdt,
                address: x.dc,
            });
            const upS = (rows) =>
                rows.length
                    ? db(sb.from("students").upsert(rows.map(toRow)))
                    : 0;
            const upSc = (id, k, o) =>
                db(
                    sb.from("scores").upsert(
                        {
                            class_id: S.id,
                            student_id: id,
                            term: k,
                            subject_idx: V.mon,
                            tx: o.tx,
                            gk: o.gk,
                            ck: o.ck,
                            updated_at: new Date().toISOString(),
                        },
                        { onConflict: "student_id,term,subject_idx" },
                    ),
                );
            function setHK(k, id, v) {
                (S.hk[k] ??= {})[id] = v;
                db(
                    v
                        ? sb.from("conduct").upsert({
                              student_id: id,
                              class_id: S.id,
                              term: k,
                              level: v,
                          })
                        : sb
                              .from("conduct")
                              .delete()
                              .eq("student_id", id)
                              .eq("term", k),
                );
            }
            const upAt = (day, ids) =>
                db(
                    sb.from("attendance").upsert(
                        ids.map((i) => ({
                            student_id: i,
                            class_id: S.id,
                            day,
                            status: S.att[day][i],
                        })),
                        { onConflict: "student_id,day" },
                    ),
                );
            async function fa(t, id, ord) {
                let r = [],
                    f = 0;
                for (;;) {
                    let q = sb.from(t).select("*").eq("class_id", id);
                    ord.forEach((c) => (q = q.order(c)));
                    const { data, error } = await q.range(f, f + 999);
                    if (error) throw error;
                    r = r.concat(data);
                    if (data.length < 1000) return r;
                    f += 1000;
                }
            }
            async function loadCls(id) {
                try {
                    msg("Đang tải dữ liệu…");
                    const [c, me, st, sc, cd, at, fu] = await Promise.all([
                        sb.from("classes").select("*").eq("id", id).single(),
                        sb
                            .from("class_members")
                            .select("role,subject_idx")
                            .eq("class_id", id)
                            .eq("user_id", USER.id)
                            .single(),
                        fa("students", id, ["code", "id"]),
                        fa("scores", id, ["id"]),
                        fa("conduct", id, ["student_id", "term"]),
                        fa("attendance", id, ["day", "student_id"]),
                        fa("fund", id, ["id"]),
                    ]);
                    if (c.error) throw c.error;
                    if (me.error) throw me.error;
                    const k = c.data;
                    const n = {
                        id,
                        role: me.data.role,
                        mine: me.data.subject_idx || [],
                        cls: {
                            n: k.name,
                            y: k.school_year || "",
                            g: k.gvcn_name || "",
                        },
                        subj: k.subjects,
                        f: { mon: k.formula_mon, nam: k.formula_nam },
                        st: st.map((r) => ({
                            id: r.id,
                            ma: r.code || "",
                            ten: r.full_name,
                            ns: r.dob || "",
                            gt: r.gender || "Nam",
                            ph: r.guardian || "",
                            sdt: r.phone || "",
                            dc: r.address || "",
                        })),
                        sc: { HK1: {}, HK2: {} },
                        hk: { HK1: {}, HK2: {}, CN: {} },
                        att: {},
                        fund: fu.map((r) => ({
                            id: r.id,
                            d: r.day,
                            t: r.kind,
                            c: r.content || "",
                            m: Number(r.amount),
                            w: r.who || "",
                        })),
                    };
                    sc.forEach((r) => {
                        ((n.sc[r.term] ??= {})[r.student_id] ??= {})[
                            r.subject_idx
                        ] = {
                            tx: (r.tx || []).map(Number),
                            gk: r.gk == null ? null : +r.gk,
                            ck: r.ck == null ? null : +r.ck,
                        };
                    });
                    cd.forEach((r) => {
                        (n.hk[r.term] ??= {})[r.student_id] = r.level;
                    });
                    at.forEach((r) => {
                        (n.att[r.day] ??= {})[r.student_id] = r.status;
                    });
                    S = n;
                    const e = ROOT.list.find((x) => x.id == id);
                    if (e) e.cls = S.cls;
                    try {
                        localStorage.setItem("scn_last", id);
                    } catch (x) {}
                    V.edit = V.del = null;
                    V.xm = "";
                    if (!isCN()) V.tab = "diem";
                    hdr();
                    R();
                    msg("");
                } catch (err) {
                    msg("Không tải được: " + err.message);
                }
            }
            async function loadMem() {
                const { data, error } = await sb.rpc("list_members", {
                    p_class: S.id,
                });
                V.mem = error ? [] : data;
                V.gm = error ? error.message : V.gm;
                R();
            }
            async function inv() {
                const em = $("#ge").value.trim(),
                    sj = [...document.querySelectorAll(".gs:checked")].map(
                        (x) => +x.value,
                    );
                if (!em) {
                    msg("Nhập email giáo viên");
                    return;
                }
                const { error } = await sb.rpc("add_member", {
                    p_class: S.id,
                    p_email: em,
                    p_subjects: sj,
                });
                V.gm = error ? error.message : "Đã mời / cập nhật " + em;
                await loadMem();
            }
            async function rmM(u) {
                await db(
                    sb
                        .from("class_members")
                        .delete()
                        .eq("class_id", S.id)
                        .eq("user_id", u),
                );
                loadMem();
            }
            function tGV() {
                return `<div class="card"><h2>Mời giáo viên bộ môn</h2><p class="mut">Giáo viên đăng ký tài khoản trước, rồi thầy/cô nhập đúng email đó. Chọn các môn họ được nhập điểm. Mời lại cùng email để đổi môn.</p><label><span>Email giáo viên</span><input id="ge" type="email"></label><div class="bar" style="margin-top:8px">${S.subj.map((m, i) => `<label><input type="checkbox" class="gs" value="${i}" style="width:auto"> ${esc(m)}</label>`).join("")}</div><button class="b" onclick="inv()">Mời / cập nhật</button><p class="mut">${esc(V.gm || "")}</p></div>
<div class="card"><h2>Thành viên lớp</h2><div class="tw"><table><tr><th>Email</th><th>Vai trò</th><th>Môn được nhập điểm</th><th>Mật khẩu</th><th></th></tr>${(V.mem || []).map((m, i) => `<tr><td class="email">${esc(m.email)}</td><td>${m.role == "gvcn" ? "GVCN" : "GV bộ môn"}</td><td>${m.role == "gvcn" ? "Tất cả" : (m.subject_idx || []).map((i) => esc(S.subj[i] || "?")).join(", ") || "—"}</td><td><span class="mut" style="margin-right:6px" title="Mật khẩu được mã hóa một chiều, không thể xem">••••••••</span> <button class="b g" onclick="resetPw(${i})">Gửi link đặt lại</button></td><td>${m.role == "gvcn" ? "" : `<button class="b d" onclick="rmM('${m.user_id}')">Xóa</button>`}</td></tr>`).join("") || "<tr><td colspan=5>Đang tải…</td></tr>"}</table></div></div>`;
            }
            function showAuth(m, note) {
                $("#auth").style.display = "block";
                const c = CFG() || {};
                $("#ab").innerHTML =
                    m == "cfg"
                        ? `<h2>Kết nối Supabase</h2><label><span>Project URL</span><input id="au" value="${esc(c.url || "")}" placeholder="https://zraipwtiielegxbzrecy.supabase.co/"></label><br><label><span>Publishable key (sb_publishable_… hoặc anon)</span><input id="ak" value="${esc(c.key || "")}"></label><p class="mut">Không dán secret key hoặc service_role.</p><p class="neg">${esc(note || "")}</p><button class="b" onclick="saveCfg()">Lưu và tiếp tục</button>`
                        : m == "reset"
                          ? `<h2>Đặt mật khẩu mới</h2><label><span>Mật khẩu mới (từ 6 ký tự)</span><input id="np" type="password"></label><p class="neg">${esc(note || "")}</p><button class="b" onclick="setPw()">Lưu mật khẩu</button>`
                          : `<h2>Đăng nhập Sổ chủ nhiệm</h2><label><span>Email</span><input id="ae" type="email"></label><br><label><span>Mật khẩu (từ 6 ký tự)</span><input id="ap" type="password"></label><p class="neg">${esc(note || "")}</p><button class="b" onclick="auth(0)">Đăng nhập</button> <button class="b g" onclick="auth(1)">Đăng ký</button> ${ENV() ? "" : `<button class="b g" onclick="showAuth('cfg')">Đổi kết nối</button>`}`;
            }
            function nu(r) {
                try {
                    const u = new URL(String(r).trim());
                    const m = u.pathname.match(/\/project\/([a-z0-9]+)/);
                    if (/(^|\.)supabase\.com$/.test(u.hostname) && m)
                        return "https://" + m[1] + ".supabase.co";
                    return u.origin;
                } catch (e) {
                    return "";
                }
            }
            function saveCfg() {
                const url = nu($("#au").value),
                    key = $("#ak").value.trim();
                let bad =
                    !/^https:\/\/.+/.test(url) ||
                    !key ||
                    key.startsWith("sb_secret_");
                try {
                    if (
                        JSON.parse(atob(key.split(".")[1])).role ==
                        "service_role"
                    )
                        bad = true;
                } catch (e) {}
                if (bad) {
                    showAuth(
                        "cfg",
                        "URL không hợp lệ hoặc khóa không được phép (không dùng secret/service_role).",
                    );
                    return;
                }
                try {
                    localStorage.setItem(
                        "scn_cfg",
                        JSON.stringify({ url, key }),
                    );
                } catch (e) {}
                boot();
            }
            async function setPw() {
                const p = $("#np").value;
                if (p.length < 6) {
                    showAuth("reset", "Mật khẩu phải từ 6 ký tự");
                    return;
                }
                const { error } = await sb.auth.updateUser({ password: p });
                if (error) {
                    showAuth("reset", error.message);
                    return;
                }
                REC = false;
                history.replaceState(
                    null,
                    "",
                    location.pathname + location.search,
                );
                const { data } = await sb.auth.getSession();
                USER = data.session.user;
                await start();
            }
            async function resetPw(i) {
                const e = (V.mem[i] || {}).email;
                if (!e) return;
                const { error } = await sb.auth.resetPasswordForEmail(e, {
                    redirectTo: location.origin + location.pathname,
                });
                V.gm = error
                    ? error.message
                    : "Đã gửi email đặt lại mật khẩu tới " + e;
                R();
            }
            async function auth(su) {
                const e = $("#ae").value.trim(),
                    p = $("#ap").value;
                const r = su
                    ? await sb.auth.signUp({ email: e, password: p })
                    : await sb.auth.signInWithPassword({
                          email: e,
                          password: p,
                      });
                if (r.error) {
                    showAuth("login", r.error.message);
                    return;
                }
                if (!r.data.session) {
                    showAuth(
                        "login",
                        "Đã đăng ký. Kiểm tra email để xác nhận rồi đăng nhập.",
                    );
                    return;
                }
                USER = r.data.session.user;
                await start();
            }
            async function boot() {
                const c = CFG();
                if (!c) {
                    showAuth("cfg");
                    return;
                }
                if (!window.supabase) {
                    showAuth(
                        "cfg",
                        "Không tải được thư viện Supabase (cần có mạng).",
                    );
                    return;
                }
                sb = supabase.createClient(nu(c.url), c.key);
                const { data } = await sb.auth.getSession();
                if (REC && data.session) {
                    showAuth("reset");
                    return;
                }
                if (!data.session) {
                    showAuth("login");
                    return;
                }
                USER = data.session.user;
                await start();
            }
            async function start() {
                $("#auth").style.display = "none";
                setUser(USER);
                const { data, error } = await sb
                    .from("classes")
                    .select("id,name,school_year,gvcn_name")
                    .order("created_at");
                if (error) {
                    msg(error.message);
                    return;
                }
                ROOT = {
                    list: data.map((c) => ({
                        id: c.id,
                        cls: {
                            n: c.name,
                            y: c.school_year || "",
                            g: c.gvcn_name || "",
                        },
                    })),
                };
                S = null;
                let l = null;
                try {
                    l = localStorage.getItem("scn_last");
                } catch (e) {}
                const id = ROOT.list.find((c) => c.id == l)
                    ? l
                    : ROOT.list[0]?.id;
                if (id) await loadCls(id);
                else {
                    hdr();
                    R();
                }
            }
            // ---- công thức tùy chỉnh
            const NAMES = ["TX", "N", "GK", "CK", "TBTX", "HK1", "HK2"],
                FC = {};
            function fn(f) {
                if (FC[f]) return FC[f];
                const ids = f.match(/[A-Za-z_]\w*/g) || [];
                if (
                    !f ||
                    /[^0-9A-Za-z_+\-*\/().,\s?:<>=]/.test(f) ||
                    ids.some(
                        (i) => ![...NAMES, "min", "max", "round"].includes(i),
                    )
                )
                    throw Error(
                        "chỉ dùng số, + - * / ( ), các biến " +
                            NAMES.join(", ") +
                            " và min, max, round",
                    );
                return (FC[f] = new Function(
                    ...NAMES,
                    "min",
                    "max",
                    "round",
                    "return (" + f + ")",
                ));
            }
            function calc(f, v) {
                try {
                    const x = fn(f)(
                        ...NAMES.map((n) => v[n] ?? 0),
                        Math.min,
                        Math.max,
                        Math.round,
                    );
                    return isFinite(x)
                        ? r1(Math.min(10, Math.max(0, x)))
                        : null;
                } catch (e) {
                    return null;
                }
            }
            function fx() {
                if (!isCN()) return "";
                return `<details class="noprint" style="margin-top:12px"><summary class="mut">Chỉnh công thức tính điểm</summary><p class="mut">Biến: TX (tổng điểm TX), N (số điểm TX), TBTX (trung bình TX), GK, CK. Công thức cả năm dùng HK1, HK2. Có thể dùng + - * / ( ), min(), max(), round(). Kết quả được làm tròn 1 chữ số và giới hạn 0–10. Áp dụng cho lớp đang chọn.</p><div class="form"><label><span>ĐTB môn mỗi học kỳ</span><input id="fm" value="${esc(S.f.mon)}"></label><label><span>ĐTB môn cả năm</span><input id="fn" value="${esc(S.f.nam)}"></label></div><p id="fe" class="neg"></p><button class="b g" onclick="saveF()">Lưu công thức</button> <button class="b g" onclick="saveF(1)">Về mặc định</button></details>`;
            }
            function saveF(d) {
                const m = d ? DFM : $("#fm").value.trim(),
                    n = d ? DFN : $("#fn").value.trim();
                const t = (f, v) => {
                    fn(f);
                    if (calc(f, v) == null)
                        throw Error("không tính ra số hợp lệ");
                };
                try {
                    t(m, { TX: 15, N: 2, GK: 8, CK: 8, TBTX: 7.5 });
                    t(n, { HK1: 7, HK2: 8 });
                } catch (e) {
                    $("#fe").textContent = "Công thức lỗi: " + e.message;
                    return;
                }
                S.f = { mon: m, nam: n };
                db(
                    sb
                        .from("classes")
                        .update({ formula_mon: m, formula_nam: n })
                        .eq("id", S.id),
                );
                R();
            }
            // ---- giao diện, màu điểm, nhập điểm Excel
            const OC = {
                C: "ok",
                T: "warn",
                P: "info",
                K: "bad",
                Nam: "info",
                Nữ: "pink",
                Tốt: "ok",
                Khá: "info",
                Đạt: "warn",
                "Chưa đạt": "bad",
            };
            const oc = (v) => (OC[v] ? "o-" + OC[v] : "");
            const scc = (v) =>
                v == null ? "" : v >= 8 ? "sc-g" : v >= 5 ? "sc-y" : "sc-r";
            const avg = (a) =>
                a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
            const sg = (v) =>
                v == null ? "—" : `<span class="sg ${scc(v)}">${v}</span>`;
            function cc(el) {
                const v = el.value
                    .split(/[;\s]+|,(?=\s|\d{1,2}(?:[,;]|$))/)
                    .map((x) => parseFloat(x.replace(",", ".")))
                    .filter((x) => !isNaN(x));
                el.className = scc(avg(v));
                const n = el.nextElementSibling;
                if (n && n.classList.contains("pr")) {
                    n.textContent = el.value;
                    n.className = "pr " + el.className;
                }
            }
            document.addEventListener("change", (e) => {
                const t = e.target;
                if (t.matches && t.matches("select.opt"))
                    t.className = "opt " + oc(t.value);
            });
            function thmL() {
                const c = document.documentElement.dataset.theme || "auto";
                $("#th").textContent = {
                    auto: "◐ Tự động",
                    light: "☀ Sáng",
                    dark: "☾ Tối",

                        .trim();
                const dt = (v) => {
                    if (v instanceof Date)
                        return new Date(v.getTime() + 432e5)
                            .toISOString()
                            .slice(0, 10);
                    v = String(v).trim();
                    let m = v.match(
                        /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/,
                    );
                    if (m)
                        return (
                            m[3] +
                            "-" +
                            m[2].padStart(2, "0") +
                            "-" +
                            m[1].padStart(2, "0")
                        );
                    return /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : "";
                };
                const rd = new FileReader();
                rd.onload = async (e) => {
                    try {
                        const wb = XLSX.read(e.target.result, {
                            type: "array",
                            cellDates: true,
                        });

                            wb.Sheets[wb.SheetNames[0]],
                            { header: 1, raw: true, defval: "" },

                            R();

                                ns: col(/ngay sinh|^ns$/),
                                gt: col(/gioi/),
                                ph: col(/phu huynh|cha me|^ph$/),
                                sdt: col(/sdt|dien thoai|phone/),
                                dc: col(/dia chi/),

                        const g = (r, k) => (C[k] < 0 ? "" : r[C[k]]);

                            T = [];

                        })
                        .join("")}</table></div>
${impUI(m, k)}${fx()}${isCN() ? "" : "<!--"}<details class="noprint" style="margin-top:12px"><summary class="mut">Đổi danh sách môn học</summary><p class="mut">Giữ nguyên thứ tự để không lệch điểm. Hai môn đầu tiên là Toán và Ngữ văn (dùng để xếp loại).</p><input id="sj" value="${esc(S.subj.join(", "))}"><br><br><button class="b g" onclick="S.subj=$('#sj').value.split(',').map(x=>x.trim()).filter(Boolean);db(sb.from('classes').update({subjects:S.subj}).eq('id',S.id));R()">Lưu danh sách môn</button></details>${isCN() ? "" : "-->"}</div>`;
                }
                return `<div class="card">${head("BẢNG TỔNG HỢP KẾT QUẢ HỌC TẬP – " + { HK1: "HỌC KỲ 1", HK2: "HỌC KỲ 2", CN: "CẢ NĂM" }[k])}${top}<div class="tw scp"><table><tr><th class="n">STT</th><th class="noprint">Mã HS</th><th>Họ và tên</th>${S.subj.map((s) => `<th class="n">${esc(s)}</th>`).join("")}<th class="n">ĐTBcm</th><th>Học tập</th><th>Rèn luyện</th></tr>
${S.st
    .map(
        (s, i) =>
            `<tr><td class="n">${i + 1}</td><td class="noprint">${esc(s.ma)}</td><td>${esc(s.ten)}</td>${S.subj
                .map((_, i) => {
                    const d = D(s.id, k, i);
                    return `<td class="n">${sg(d)}</td>`;
                })
                .join(
                    "",
                )}<td class="n">${sg(cm(s.id, k))}</td><td>${tg(hl(s.id, k))}</td><td><select class="opt ${oc((S.hk[k] || {})[s.id])}" onchange="setHK('${k}','${s.id}',this.value)"><option value="">—</option>${LV.map((l) => `<option${(S.hk[k] || {})[s.id] == l ? " selected" : ""}>${l}</option>`).join("")}</select></td></tr>`,
    )
    .join("")}</table></div>
${fx()}<p class="mut">Học tập xếp loại tự động theo Thông tư 22/2021 (Tốt / Khá / Đạt / Chưa đạt), áp dụng cho môn đánh giá bằng điểm. Rèn luyện do GVCN chọn.</p></div>`;
            }
            function setSc(id, f, v) {
                const k = V.hk;
                S.sc[k] ??= {};
                S.sc[k][id] ??= {};
                const o = (S.sc[k][id][V.mon] ??= {
                    tx: [],
                    gk: null,
                    ck: null,
                });
                const n = (x) => {
                    x = parseFloat(String(x).replace(",", "."));
                    return isNaN(x) ? null : Math.min(10, Math.max(0, x));
                };
                if (f == "tx")
                    o.tx = v
                        .split(/[;\s]+|,(?=\s|\d{1,2}(?:[,;]|$))/)
                        .map(n)
                        .filter((x) => x != null);
                else o[f] = v.trim() === "" ? null : n(v);
                upSc(id, k, o);
                $("#d-" + id).innerHTML = sg(D(id, k, V.mon));
            }
            function tDD() {
                const day = S.att[V.date];
                return `<div class="card"><div class="bar noprint"><label><span>Ngày</span><input type="date" value="${V.date}" onchange="V.date=this.value;R()"></label><button class="b g" onclick="allC()">Ghi tất cả có mặt</button><span class="sp"></span>${pb}</div>${head("ĐIỂM DANH NGÀY " + fd(V.date))}
<div class="tw"><table><tr><th class="n">STT</th><th>Họ và tên</th><th>Tình trạng</th></tr>${S.st
                    .map(
                        (s, i) =>
                            `<tr><td class="n">${i + 1}</td><td>${esc(s.ten)}</td><td><select class="opt ${oc((day || {})[s.id] || "C")}" onchange="setAtt('${s.id}',this.value)">${Object.entries(
                                ATT,
                            )
                                .map(
                                    ([c, l]) =>
                                        `<option value="${c}"${((day || {})[s.id] || "C") == c ? " selected" : ""}>${l}</option>`,
                                )
                                .join("")}</select></td></tr>`,
                    )
                    .join("")}</table></div>
<p class="mut noprint">${day ? "Đã ghi nhận ngày này." : "Ngày này chưa ghi nhận. Chọn một tình trạng hoặc bấm “Ghi tất cả có mặt” để lưu."}</p></div>
<div class="card" id="asum"></div>`;
            }
            function allC() {
                S.att[V.date] = {};
                S.st.forEach((s) => (S.att[V.date][s.id] = "C"));
                upAt(
                    V.date,
                    S.st.map((s) => s.id),
                );
                R();
            }
            function setAtt(id, v) {
                let all = 0;
                if (!S.att[V.date]) {
                    all = 1;
                    S.att[V.date] = {};
                    S.st.forEach((s) => (S.att[V.date][s.id] = "C"));
                }
                S.att[V.date][id] = v;
                upAt(V.date, all ? S.st.map((s) => s.id) : [id]);
                aSum();
            }
            function aSum() {
                const e = $("#asum");
                if (!e) return;
                const days = Object.keys(S.att).length;
                e.innerHTML = `<h2>Tổng hợp chuyên cần (${days} buổi đã ghi nhận)</h2><p class="mut">Đi trễ được tính ${LATE_W * 100}% một buổi có mặt.</p><div class="tw"><table><tr><th>Họ và tên</th><th class="n">Có phép</th><th class="n">Không phép</th><th class="n">Đi trễ</th><th class="n">Chuyên cần</th></tr>${S.st
                    .map((s) => {
                        const a = attStat(s.id);
                        return `<tr><td>${esc(s.ten)}</td><td class="n">${a.p}</td><td class="n">${a.k}</td><td class="n">${a.t}</td><td class="n">${a.rate == null ? "—" : a.rate + "%"}</td></tr>`;
                    })
                    .join("")}</table></div>`;
            }
            function tQuy() {
                const th = S.fund
                        .filter((f) => f.t == "thu")
                        .reduce((a, f) => a + f.m, 0),
                    ch = S.fund
                        .filter((f) => f.t == "chi")
                        .reduce((a, f) => a + f.m, 0);
                return `<div class="card noprint"><h2>Ghi khoản thu / chi</h2><div class="form"><label><span>Ngày</span><input id="qd" type="date" value="${today()}"></label><label><span>Loại</span><select id="qt"><option value="thu">Thu</option><option value="chi">Chi</option></select></label><label><span>Nội dung</span><input id="qc"></label><label><span>Số tiền (đồng)</span><input id="qm" inputmode="numeric"></label><label><span>Người nộp / nhận</span><input id="qw"></label></div><button class="b" onclick="addQ()">Ghi sổ</button></div>
<div class="card">${head("SỔ QUỸ LỚP")}<div class="bar noprint"><h2>Sổ quỹ</h2><span class="sp"></span>${pb}</div><div class="sum"><span class="pos">Tổng thu: ${vnd(th)}</span><span class="neg">Tổng chi: ${vnd(ch)}</span><span>Còn lại: ${vnd(th - ch)}</span></div><br>
<div class="tw"><table><tr><th>Ngày</th><th>Loại</th><th>Nội dung</th><th>Người nộp / nhận</th><th class="n">Số tiền</th><th class="noprint"></th></tr>${
                    [...S.fund]
                        .sort((a, b) => b.d.localeCompare(a.d))
                        .map(
                            (f) =>
                                `<tr><td>${fd(f.d)}</td><td>${f.t == "thu" ? "Thu" : "Chi"}</td><td>${esc(f.c)}</td><td>${esc(f.w)}</td><td class="n ${f.t == "thu" ? "pos" : "neg"}">${f.t == "thu" ? "+" : "−"}${vnd(f.m)}</td><td class="noprint"><button class="b d" onclick="delQ('${f.id}')">${V.del == f.id ? "Bấm lại để xóa" : "Xóa"}</button></td></tr>`,
                        )
                        .join("") ||
                    "<tr><td colspan=6>Chưa có khoản nào.</td></tr>"
                }</table></div></div>`;
            }
            async function addQ() {
                const m = parseInt($("#qm").value.replace(/\D/g, ""));
                if (!$("#qc").value.trim() || !m) {
                    msg("Nhập nội dung và số tiền");
                    return;
                }
                const f = {
                    id: U(),
                    d: $("#qd").value || today(),
                    t: $("#qt").value,
                    c: $("#qc").value.trim(),
                    m,
                    w: $("#qw").value.trim(),
                };
                S.fund.push(f);
                R();
                await db(
                    sb.from("fund").insert({
                        id: f.id,
                        class_id: S.id,
                        day: f.d,
                        kind: f.t,
                        content: f.c,
                        amount: f.m,
                        who: f.w,
                    }),
                );
            }
            function delQ(id) {
                if (V.del != id) {
                    V.del = id;
                    R();
                    return;
                }
                S.fund = S.fund.filter((f) => f.id != id);
                V.del = null;
                R();
                db(sb.from("fund").delete().eq("id", id));
            }
            function tBC() {
                const k = V.rhk,
                    n = S.st.length,
                    cnt = (fn) => {
                        const o = {};
                        S.st.forEach((s) => {
                            const v = fn(s);
                            if (v) o[v] = (o[v] || 0) + 1;
                        });
                        return LV.map((l) => [l, o[l] || 0]);
                    };
                const hlc = cnt((s) => hl(s.id, k)),
                    hkc = cnt((s) => (S.hk[k] || {})[s.id]);
                const mon = S.subj
                    .map((m, i) => {
                        const v = S.st
                            .map((s) => D(s.id, k, i))
                            .filter((x) => x != null);
                        return [
                            m,
                            v.length
                                ? r1(v.reduce((a, b) => a + b, 0) / v.length)
                                : null,
                        ];
                    })
                    .filter((x) => x[1] != null);
                const as = S.st.map((s) => attStat(s.id)),
                    tn = as.reduce((a, x) => a + x.n, 0),
                    ab = as.reduce((a, x) => a + x.p + x.k, 0),
                    lt = as.reduce((a, x) => a + x.t, 0),
                    kp = as.reduce((a, x) => a + x.k, 0);
                const rate = tn
                    ? Math.round(((tn - ab - lt * (1 - LATE_W)) * 1000) / tn) /
                      10
                    : null;
                const so = [...mon].sort((a, b) => b[1] - a[1]);
                const warn = S.st.filter(
                    (s) =>
                        hl(s.id, k) == "Chưa đạt" ||
                        attStat(s.id).k >= 2 ||
                        (S.hk[k] || {})[s.id] == "Chưa đạt",
                );
                return `<div class="card">${head("BÁO CÁO TỔNG HỢP LỚP")}<div class="bar noprint"><select style="width:auto" onchange="V.rhk=this.value;R()">${[
                    ["HK1", "Học kỳ 1"],
                    ["HK2", "Học kỳ 2"],
                    ["CN", "Cả năm"],
                ]
                    .map(
                        ([v, l]) =>
                            `<option value="${v}"${k == v ? " selected" : ""}>${l}</option>`,
                    )
                    .join("")}</select><span class="sp"></span>${pb}</div>
<div class="grid2"><div><h3>Học tập (${hlc.reduce((a, x) => a + x[1], 0)}/${n} em đủ điểm)</h3>${bars(hlc, n)}<h3>Rèn luyện</h3>${bars(hkc, n)}</div>
<div><h3>Chuyên cần</h3>${bars(
                    [
                        ["Có mặt đủ", tn - ab - lt],
                        ["Nghỉ có phép", ab - kp],
                        ["Nghỉ không phép", kp],
                        ["Đi trễ", lt],
                    ],
                    tn,
                )}<p>Tỉ lệ chuyên cần chung: <b>${rate == null ? "—" : rate + "%"}</b></p></div></div>
<h3>Điểm trung bình theo môn</h3>${mon.length ? mon.map(([m, v]) => `<div class="hb"><span>${esc(m)}</span><div><i style="width:${v * 10}%;background:${v < 5 ? "var(--red)" : v < 6.5 ? "var(--warn)" : "var(--pri)"}"></i></div><span>${v}</span></div>`).join("") : '<p class="mut">Chưa có điểm cho kỳ này.</p>'}
${
    so.length > 1
        ? `<h3>Nhận xét nhanh</h3><p><b class="pos">Điểm mạnh:</b> ${so
              .slice(0, 2)
              .map((x) => esc(x[0]) + " (" + x[1] + ")")
              .join(", ")}.<br><b class="neg">Cần cải thiện:</b> ${so
              .slice(-2)
              .reverse()
              .map((x) => esc(x[0]) + " (" + x[1] + ")")
              .join(", ")}.</p>`
        : ""
}
<h3>Học sinh cần quan tâm</h3>${warn.length ? "<ul>" + warn.map((s) => `<li>${esc(s.ten)} — ${[hl(s.id, k) == "Chưa đạt" ? "học tập chưa đạt" : "", attStat(s.id).k >= 2 ? "nghỉ không phép " + attStat(s.id).k + " buổi" : "", (S.hk[k] || {})[s.id] == "Chưa đạt" ? "rèn luyện chưa đạt" : ""].filter(Boolean).join(", ")}</li>`).join("") + "</ul>" : '<p class="mut">Chưa có học sinh nào cần lưu ý.</p>'}
<h3>Quỹ lớp</h3><p>Còn lại: <b>${vnd(S.fund.reduce((a, f) => a + (f.t == "thu" ? f.m : -f.m), 0))}</b></p></div>`;
            }
            const VW = {
                hs: tHS,
                diem: tDiem,
                dd: tDD,
                quy: tQuy,
                bc: tBC,
                gv: tGV,
            };
            function R() {
                if (!S) {
                    cSel();
                    $("#nav").innerHTML = "";
                    $("#app").innerHTML =
                        '<div class="card">Bạn chưa thuộc lớp nào. Nếu là GVCN, bấm “Thêm lớp”. Nếu là giáo viên bộ môn, nhờ GVCN mời bằng email <b>' +
                        esc(USER ? USER.email : "") +
                        "</b> rồi bấm “Làm mới”.</div>";
                    return;
                }
                cSel();
                $("#nav").innerHTML = (
                    isCN() ? TABS : TABS.filter((t) => t[0] == "diem")
                )
                    .map(
                        ([k, l]) =>
                            `<button class="${V.tab == k ? "on" : ""}" onclick="V.tab='${k}';V.del=null;R();if(V.tab=='gv')loadMem()">${l}</button>`,
                    )
                    .join("");
                $("#app").innerHTML = VW[V.tab]();
                aSum();
            }
            function cSel() {
                $("#cs").innerHTML = ROOT.list
                    .map(
                        (c) =>
                            `<option value="${c.id}"${c.id == S?.id ? " selected" : ""}>${esc(c.cls.n || "Lớp chưa đặt tên")}${c.cls.y ? " – " + esc(c.cls.y) : ""}</option>`,
                    )
                    .join("");
            }
            function hdr() {
                if (!S) {
                    ["cn", "cy", "cg"].forEach((i) => ($("#" + i).value = ""));
                    return;
                }
                [
                    ["cn", "n"],
                    ["cy", "y"],
                    ["cg", "g"],
                ].forEach(([id, k]) => {
                    const e = $("#" + id);
                    e.value = S.cls[k];
                    e.disabled = !isCN();
                });
                $("#dc").style.display = isCN() ? "" : "none";
            }
            [
                ["cn", "n"],
                ["cy", "y"],
                ["cg", "g"],
            ].forEach(([id, k]) => {
                $("#" + id).oninput = (e) => {
                    if (!isCN()) return;
                    S.cls[k] = e.target.value;
                    cSel();
                    clearTimeout(T1);
                    T1 = setTimeout(
                        () =>
                            db(
                                sb
                                    .from("classes")
                                    .update({
                                        name: S.cls.n || "Lớp chưa đặt tên",
                                        school_year: S.cls.y,
                                        gvcn_name: S.cls.g,
                                    })
                                    .eq("id", S.id),
                            ),
                        700,
                    );
                };
            });
            $("#cs").onchange = (e) => loadCls(e.target.value);
            $("#rf").onclick = () => {
                if (S) loadCls(S.id);
            };
            $("#lo").onclick = async () => {
                await sb.auth.signOut();
                USER = null;
                setUser(null);
                S = null;
                showAuth("login");
            };
            $("#ac").onclick = async () => {
                const { data, error } = await sb
                    .from("classes")
                    .insert({ name: "Lớp mới" })
                    .select()
                    .single();
                if (error) {
                    msg(error.message);
                    return;
                }
                ROOT.list.push({
                    id: data.id,
                    cls: { n: data.name, y: "", g: "" },
                });
                V.tab = "hs";
                await loadCls(data.id);
                $("#cn").focus();
            };
            $("#dc").onclick = async function () {
                if (!this.dataset.s) {
                    this.dataset.s = 1;
                    this.textContent = "Bấm lại để xóa lớp này";
                    setTimeout(() => {
                        this.dataset.s = "";
                        this.textContent = "Xóa lớp";
                    }, 4000);
                    return;
                }
                this.dataset.s = "";
                this.textContent = "Xóa lớp";
                const { error } = await sb
                    .from("classes")
                    .delete()
                    .eq("id", S.id);
                if (error) {
                    msg(error.message);
                    return;
                }
                ROOT.list = ROOT.list.filter((c) => c.id != S.id);
                S = null;
                if (ROOT.list[0]) await loadCls(ROOT.list[0].id);
                else {
                    hdr();
                    R();
                }
            };
            if ("serviceWorker" in navigator) {
                addEventListener("load", () =>
                    navigator.serviceWorker.register("./service-worker.js"),
                );
            }
            boot();
        </script>
    </body>
</html>
